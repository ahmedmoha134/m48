@layer base {
  html, body {
    font-family: 'Tajawal', sans-serif;
    direction: rtl;
    overflow-x: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
}
.font-display {
  font-family: 'Baloo Bhaijaan 2', 'Tajawal', cursive, sans-serif;
}
.font-ui {
  font-family: 'Tajawal', sans-serif;
}
.porthole-card {
  background: linear-gradient(180deg, #ffffff 0%, #f0f9ff 100%);
  border: 3.5px solid #38bdf8;
  box-shadow: 0 7px 0 #0369a1, 0 14px 32px rgba(2, 24, 58, 0.38);
}
.brass-plaque {
  background: linear-gradient(180deg, #ffe169 0%, #ffb703 100%);
  border: 3px solid #9c6600;
  box-shadow: 0 5px 0 #7a4900, inset 0 2px 0 rgba(255, 255, 255, 0.65);
}
.btn-ocean {
  transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.16s ease, filter 0.16s ease;
}
.btn-ocean:hover:not(:disabled) {
  transform: translateY(-2px) scale(1.02);
  filter: brightness(1.04);
}
.btn-ocean:active:not(:disabled) {
  transform: translateY(4px) scale(0.98);
}
@keyframes subBob {
  0%, 100% {
    transform: translateY(0px) rotate(-1deg);
  }
  50% {
    transform: translateY(-9px) rotate(1.5deg);
  }
}
@keyframes bubbleFloat {
  0%, 100% {
    transform: translateY(0px) translateX(0px) scale(1);
  }
  33% {
    transform: translateY(-7px) translateX(4px) scale(1.03);
  }
  66% {
    transform: translateY(-3px) translateX(-4px) scale(0.98);
  }
}
@keyframes bubbleRiseBg {
  0% {
    transform: translateY(105vh) scale(0.7);
    opacity: 0;
  }
  15% {
    opacity: 0.65;
  }
  85% {
    opacity: 0.55;
  }
  100% {
    transform: translateY(-15vh) scale(1.15);
    opacity: 0;
  }
}
@keyframes gentleNudge {
  0%, 100% {
    transform: translateX(0);
  }
  20% {
    transform: translateX(-7px) rotate(-2deg);
  }
  40% {
    transform: translateX(7px) rotate(2deg);
  }
  60% {
    transform: translateX(-5px) rotate(-1deg);
  }
  80% {
    transform: translateX(5px) rotate(1deg);
  }
}
@keyframes popCelebrate {
  0% {
    transform: scale(0.75);
    opacity: 0;
  }
  60% {
    transform: scale(1.08);
    opacity: 1;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}
@keyframes kelpSway {
  0%, 100% {
    transform: rotate(-4deg);
  }
  50% {
    transform: rotate(4deg);
  }
}
@keyframes sonarPulse {
  0%, 100% {
    box-shadow: 0 0 0 0 rgba(0, 180, 216, 0.55), 0 5px 0 #0284c7;
  }
  50% {
    box-shadow: 0 0 22px 8px rgba(56, 189, 248, 0.7), 0 5px 0 #0284c7;
  }
}
@keyframes glowGold {
  0%, 100% {
    box-shadow: 0 0 0 0 rgba(255, 183, 3, 0.55), 0 6px 0 #b37700;
  }
  50% {
    box-shadow: 0 0 26px 9px rgba(255, 209, 102, 0.8), 0 6px 0 #b37700;
  }
}
@keyframes spinSlow {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}
.animate-sub-bob {
  animation: subBob 3.4s ease-in-out infinite;
}
.animate-bubble-float {
  animation: bubbleFloat 3.6s ease-in-out infinite;
}
.animate-bubble-rise {
  animation: bubbleRiseBg 11s linear infinite;
}
.animate-nudge {
  animation: gentleNudge 0.45s ease-in-out;
}
.animate-pop-in {
  animation: popCelebrate 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
.animate-kelp {
  animation: kelpSway 4.5s ease-in-out infinite;
  transform-origin: bottom center;
}
.animate-sonar {
  animation: sonarPulse 2.2s ease-in-out infinite;
}
.animate-glow-gold {
  animation: glowGold 2s ease-in-out infinite;
}
.animate-spin-slow {
  animation: spinSlow 14s linear infinite;
}
